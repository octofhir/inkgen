# Config used by the CI "typecheck-generated" job.
#
# Mirrors inkgen.toml but disables profile generation: profile-class generation
# currently emits TypeScript that does not typecheck (classes extending
# interfaces, missing resourceType, type-predicate mismatches). Tracked as P1 in
# docs/analysis/inkgen-improvement-plan.md. The gate proves the core surface
# (interfaces, nested types, ValueSets, branded primitives, Zod, interop)
# compiles. Re-enable profiles here once that bug is fixed.

[[packages]]
name = "hl7.fhir.r4.core"
version = "4.0.1"
folder = "r4-core"

[languages.typescript]
mode = "interface"
output_structure = "by_package"
output_dir = "generated"
generate_profiles = false

branded_primitives = true

generate_interop = true
interop_typed_references = true
interop_date_helpers = true
interop_bundle_traversal = true
interop_search_helpers = true
interop_search_advanced = true
