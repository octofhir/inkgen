[package]
name = "inkgen-rust"
version = "0.1.0"
edition = "2024"
publish = false
description = "Example FHIR code generator backend for Rust - demonstrates extensible backend architecture"

[dependencies]
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }

inkgen-core = { path = "../inkgen-core", default-features = false }

[dev-dependencies]
indexmap = { workspace = true }
insta = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }
