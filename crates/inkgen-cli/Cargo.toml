[package]
name = "inkgen-cli"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
inkgen-core = { path = "../inkgen-core" }
inkgen-typescript = { path = "../inkgen-typescript" }
