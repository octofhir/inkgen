[package]
name = "inkgen-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "FHIR code generator CLI - Generate type-safe SDKs from FHIR specifications"
readme = "README.md"

[[bin]]
name = "inkgen"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
inkgen-core = { path = "../inkgen-core" }
inkgen-typescript = { path = "../inkgen-typescript" }
inkgen-rust = { path = "../inkgen-rust" }
inkgen-gleam = { path = "../inkgen-gleam" }
serde_json = { workspace = true }
clap_complete = "4"
similar = "3.2"
dirs = "7.0"
tempfile = { workspace = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = { workspace = true }
criterion = { workspace = true }
indexmap = { workspace = true }

[[bench]]
name = "codegen"
harness = false
