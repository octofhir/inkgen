[package]
name = "inkgen-gleam"
version = "0.1.0"
edition = "2024"
publish = false
description = "FHIR code generator backend for Gleam — emits Gleam types from a resolved PackageIr"

[dependencies]
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }

inkgen-core = { path = "../inkgen-core", default-features = false }

[dev-dependencies]
indexmap = { workspace = true }
insta = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }

[lints]
workspace = true
