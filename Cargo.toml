[workspace]
members = [
    "crates/inkgen-cli",
    "crates/inkgen-core",
    "crates/inkgen-typescript",
    "crates/inkgen-rust",
    "crates/inkgen-gleam",
    "crates/inkgen-testing",
]
resolver = "3"


[workspace.lints.rust]
closure_returning_async_block = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_extern_crates = "warn"

[workspace.package]
version = "0.1.5"
authors = ["OctoFHIR Team <funyloony@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/octofhir/inkgen"
homepage = "https://github.com/octofhir/inkgen"
documentation = "https://docs.rs/inkgen-cli"
keywords = ["fhir", "codegen", "healthcare", "typescript", "sdk"]
categories = ["command-line-utilities", "development-tools"]
edition = "2024"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tera = { version = "1.19", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.0", default-features = false }
toml = "0.9"
anyhow = "1"
thiserror = "2"
insta = "1.44"
tempfile = "3.8"
indexmap = { version = "2", features = ["serde"] }
octofhir-canonical-manager = { version = "0.2.14", default-features = false, features = ["sqlite", "http"] }
url = "2.5"
criterion = { version = "0.8", features = ["async_tokio"] }
similar = "3.2"

