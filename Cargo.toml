[workspace]
members = [
    "crates/inkgen-cli",
    "crates/inkgen-core",
    "crates/inkgen-typescript",
    "crates/inkgen-testing",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["OctoFHIR Team <funyloony@gmail.com>"]
license = "MIT"
repository = "https://github.com/octofhir/inkgen"
homepage = "https://github.com/octofhir/inkgen"
documentation = "https://docs.rs/inkgen-cli"
keywords = ["fhir", "codegen", "healthcare", "typescript", "sdk"]
categories = ["command-line-utilities", "development-tools"]
edition = "2024"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tera = "1.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.0", features = ["full"] }
toml = "0.8"
anyhow = "1"
thiserror = "2"
insta = "1.34"
tempfile = "3.8"
indicatif = "0.17"
regex = "1.10"
indexmap = { version = "2.0", features = ["serde"] }
octofhir-canonical-manager = "0.1.13"
async-trait = "0.1"
futures = "0.3"
url = "2.5"
