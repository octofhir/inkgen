name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
        default: 'patch'
      custom_version:
        description: 'Custom version (only used if version_bump is "custom", e.g., 1.2.3)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (no commits or tags)'
        required: false
        type: boolean
        default: false
      create_release:
        description: 'Create GitHub release after version bump'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.new_version.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      - name: Get current version
        id: current_version
        run: |
          CURRENT_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Calculate new version
        id: new_version
        run: |
          CURRENT="${{ steps.current_version.outputs.version }}"
          BUMP="${{ inputs.version_bump }}"
          CUSTOM="${{ inputs.custom_version }}"

          if [ "$BUMP" = "custom" ]; then
            if [ -z "$CUSTOM" ]; then
              echo "Error: Custom version is required when version_bump is 'custom'"
              exit 1
            fi
            NEW_VERSION="$CUSTOM"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              major)
                NEW_VERSION="$((MAJOR + 1)).0.0"
                ;;
              minor)
                NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
                ;;
              patch)
                NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
                ;;
            esac
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Update workspace version
        if: ${{ !inputs.dry_run }}
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"

          # Update workspace version in root Cargo.toml
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" Cargo.toml

          echo "Updated Cargo.toml to version $NEW_VERSION"
          grep -A5 '\[workspace.package\]' Cargo.toml

      - name: Verify changes
        run: |
          cargo check --workspace
          cargo test --workspace --lib

      - name: Generate changelog
        if: ${{ !inputs.dry_run }}
        id: changelog
        run: |
          cargo install git-cliff --locked
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"

          # Check if this is the first release (no previous tags)
          TAG_COUNT=$(git tag -l 'v*' | wc -l)

          if [ "$TAG_COUNT" -eq 0 ]; then
            # First release - generate initial changelog
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "All notable changes to this project will be documented in this file." >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "## [v$NEW_VERSION] - $(date +%Y-%m-%d)" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "Initial release of InkGen - FHIR code generator." >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "### Features" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log --oneline --no-merges | head -20 | sed 's/^[a-f0-9]* /- /' >> CHANGELOG.md
          else
            # Subsequent releases - use git-cliff to update full changelog
            git-cliff --output CHANGELOG.md || {
              # Fallback if git-cliff fails
              echo "## [v$NEW_VERSION] - $(date +%Y-%m-%d)" > /tmp/new_changes.md
              echo "" >> /tmp/new_changes.md
              echo "### Changes" >> /tmp/new_changes.md
              echo "" >> /tmp/new_changes.md
              git log --oneline --no-merges $(git describe --tags --abbrev=0)..HEAD | sed 's/^[a-f0-9]* /- /' >> /tmp/new_changes.md
              echo "" >> /tmp/new_changes.md

              # Prepend to existing changelog or create new
              if [ -f CHANGELOG.md ]; then
                cat /tmp/new_changes.md CHANGELOG.md > /tmp/full_changelog.md
                mv /tmp/full_changelog.md CHANGELOG.md
              else
                mv /tmp/new_changes.md CHANGELOG.md
              fi
            }
          fi

          echo "Generated changelog:"
          head -50 CHANGELOG.md

      - name: Commit version bump and changelog
        if: ${{ !inputs.dry_run }}
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          git add Cargo.toml CHANGELOG.md
          git commit -m "chore: release v$NEW_VERSION"
          echo "Committed version bump and changelog"

      - name: Create and push tag
        if: ${{ !inputs.dry_run }}
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          git push origin main --follow-tags
          echo "Pushed tag v$NEW_VERSION"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run && inputs.create_release }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.new_version.outputs.new_version }}
          name: Release v${{ steps.new_version.outputs.new_version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "=== DRY RUN SUMMARY ==="
          echo "Current version: ${{ steps.current_version.outputs.version }}"
          echo "New version would be: ${{ steps.new_version.outputs.new_version }}"
          echo "Version bump type: ${{ inputs.version_bump }}"
          echo ""
          echo "Changes that would be made:"
          echo "  - Update version in Cargo.toml"
          echo "  - Commit: 'chore: bump version to ${{ steps.new_version.outputs.new_version }}'"
          echo "  - Create tag: v${{ steps.new_version.outputs.new_version }}"
          if [ "${{ inputs.create_release }}" = "true" ]; then
            echo "  - Create GitHub release"
          fi

  build-binaries:
    name: Build Release Binaries
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: inkgen
            asset_name: inkgen-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: inkgen
            asset_name: inkgen-linux-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: inkgen
            asset_name: inkgen-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: inkgen
            asset_name: inkgen-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: inkgen.exe
            asset_name: inkgen-windows-amd64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p inkgen-cli --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.asset_name }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          copy target\${{ matrix.target }}\release\${{ matrix.binary_name }} ${{ matrix.asset_name }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.release.outputs.new_version }}
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
