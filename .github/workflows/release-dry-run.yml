name: Release Dry-Run

on:
  push:
    tags:
      - 'v*'
      - 'cli-v*'

permissions:
  contents: read

jobs:
  release-dry-run:
    name: Release Dry-Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Run release dry-run
        run: |
          cargo install cargo-release --locked
          cargo release --workspace --dry-run --no-tag --no-push

      - name: Verify workspace integrity
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all --lib
          cargo test --all --doc

      - name: Generate changelog preview
        run: |
          cargo install git-cliff --locked
          git-cliff --unreleased --output /tmp/CHANGELOG_preview.md
          echo "=== Changelog Preview ==="
          cat /tmp/CHANGELOG_preview.md

  validate-binaries:
    name: Validate Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build CLI binary
        run: cargo build --release -p inkgen-cli --target ${{ matrix.target }}

      - name: Verify binary functionality
        run: cargo run --release -p inkgen-cli -- --version

      - name: Upload binary artifact
        uses: actions/upload-artifact@v3
        with:
          name: inkgen-cli-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/inkgen-cli*
          if-no-files-found: ignore
