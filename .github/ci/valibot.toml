# CI manifest mirroring inkgen.toml with the Valibot validation dialect.
# Used by the "Typecheck generated TypeScript" job to typecheck Valibot output.

[[packages]]
name = "hl7.fhir.r4.core"
version = "4.0.1"
folder = "r4-core"

[languages.typescript]
mode = "interface"
output_structure = "by_package"
output_dir = "generated"
validation_library = "valibot"

branded_primitives = true

generate_interop = true
interop_typed_references = true
interop_date_helpers = true
interop_bundle_traversal = true
interop_search_helpers = true
interop_search_advanced = true